proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

# GET-запросы распределяются между тремя экземплярами в соотношении 2:1:1.
upstream shop_read {
    server shopapp:8080 weight=2;
    server shopapp_read1:8080;
    server shopapp_read2:8080;
}

# Методы записи обслуживает только основной экземпляр.
upstream shop_write {
    server shopapp:8080;
}

# Выбор группы бэкендов по HTTP-методу запроса.
map $request_method $shop_backend {
    GET     shop_read;
    default shop_write;
}

server {
    # HTTP и HTTPS используют одни и те же маршруты.
    listen 80;
    listen 443 ssl;
    server_name be3.shop;

    ssl_certificate /etc/nginx/certs/be3.shop.crt;
    ssl_certificate_key /etc/nginx/certs/be3.shop.key;

    root /data/www;

    # Сжатие текстовых ответов; изображения и другие медиа не включены.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1100;
    gzip_types text/plain text/css application/json
               application/x-javascript text/javascript application/javascript
               text/xml application/xml application/xml+rss;

    # Интерфейс pgAdmin и его ресурсы под префиксом /admin/.
    location /admin/ {
        proxy_set_header X-Script-Name /admin;
        proxy_set_header Host $host;
        proxy_pass http://pgadmin/;
        proxy_redirect off;
    }

    # Статистика соединений и запросов самого Nginx.
    location = /status {
        stub_status;
    }

    # Точный адрес /api/v1 перенаправляет браузер на страницу Swagger.
    location = /api/v1 {
        return 302 /swagger/index.html;
    }

    # Приложение отдаёт страницу Swagger, её стили, скрипты и спецификацию.
    location /swagger/ {
        proxy_pass http://shopapp:8080;
    }

    # GET-запросы API балансируются, остальные идут на основной экземпляр.
    location /api/v1/ {
        # Адрес бэкенда для демонстрации распределения запросов.
        add_header X-Upstream-Addr $upstream_addr always;
        # MISS — запрос к бэкенду, HIT — ответ из кеша Nginx.
        add_header X-Cache-Status $upstream_cache_status always;

        # Успешные GET-ответы сохраняются в кеше на одну минуту.
        proxy_cache my_cache;
        proxy_cache_valid 200 1m;
        proxy_pass http://$shop_backend;
    }

    # Короткий префикс /api/ заменяется на внутренний /api/v1/ приложения.
    location /api/ {
        proxy_pass http://shopapp:8080/api/v1/;
    }
}
